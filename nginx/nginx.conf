server {
  listen 80;

  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  location /api/v1/users    { proxy_pass http://auth:3000; }
  location /api/v1/tickets  { proxy_pass http://tickets:3000; }
  location /api/v1/orders   { proxy_pass http://orders:3000; }
  location /api/v1/payments { proxy_pass http://payments:3000; }

  location / { proxy_pass http://client:3000; }
}
